{% extends "auctions/layout.html" %}

{% block title %}Daxil Ol | Onlayn Hərrac Sistemi{% endblock %}

{% block body %}

<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 440px;">
        <!-- Logo & Title -->
        <div class="auth-brand-center">
            <div class="brand-icon mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-hammer"></i>
            </div>
            <h2 class="h3 fw-bold mb-1">Xoş Gəlmisiniz</h2>
            <p class="text-muted small">Hərraclara qatılmaq üçün hesabınıza daxil olun</p>
        </div>

        {% if message %}
            <div class="alert alert-danger py-2 px-3 small mb-3">
                <i class="bi bi-exclamation-circle-fill me-1"></i>
                {{ message }}
            </div>
        {% endif %}

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}

            <div class="auth-input-group mb-3">
                <i class="bi bi-person auth-input-icon"></i>
                <input autofocus class="form-control" type="text" name="username" placeholder="İstifadəçi adı və ya E-poçt (FT-2)" required>
            </div>

            <div class="auth-input-group mb-4">
                <i class="bi bi-lock auth-input-icon"></i>
                <input class="form-control" type="password" name="password" id="loginPassword" placeholder="Şifrə" required>
            </div>

            <button class="btn btn-primary w-100 py-2 fs-6 mb-3" type="submit">
                <i class="bi bi-box-arrow-in-right me-1"></i> Daxil Ol
            </button>
        </form>

        <div class="text-center pt-3 border-top small text-muted">
            Hesabınız yoxdur? 
            <a href="{% url 'register' %}" class="fw-bold text-primary">İndi qeydiyyatdan keçin</a>
        </div>
    </div>
</div>

{% endblock %}
